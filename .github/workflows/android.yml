name: Android OCR tasker plugin CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Compile with Gradle (debug)
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - name: Set up Git tag
        id: tag
        run: |
          TAG=$(git describe --tags --always 2>/dev/null || echo "no-tag")
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
      - name: Archive debug APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: OCR-${{ env.TAG_NAME }}-debug-apks
          path: app/build/outputs/**/*.apk
          retention-days: 7
